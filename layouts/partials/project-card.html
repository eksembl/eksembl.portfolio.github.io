<a class="project-card" href="{{ .RelPermalink }}">
  <span class="project-card__prompt" aria-hidden="true">&gt;</span>
  <span class="project-card__body">
    <span class="project-card__title">{{ .Title }}</span>
    {{ with .Description }}
      <span class="project-card__desc">{{ . }}</span>
    {{ end }}
    {{ with .Params.tags }}
      <span class="project-card__tags">
        {{- range $i, $tag := first 4 . -}}
          {{- if $i }} {{ end -}}#{{ $tag }}
        {{- end -}}
      </span>
    {{ end }}
  </span>
</a>
